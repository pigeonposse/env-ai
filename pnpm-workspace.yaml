packages:
  - packages/*

allowBuilds:
  canvas: true
  esbuild: true
  sharp: true
  tree-sitter: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - vite@6.0.0
  - tmp@0.2.4
  - preact@10.26.10
  - lodash@4.17.23
  - js-yaml@3.14.2
  - js-yaml@4.1.1
  - compressing@1.10.4
  - mdast-util-to-hast@13.2.1
  - markdown-it@14.1.1
  - minimatch@5.1.7
  - minimatch@9.0.6
  - rollup@4.59.0
  - rollup@2.80.0
  - minimatch@5.1.8
  - minimatch@9.0.7
  - serialize-javascript@7.0.3
  - ajv@8.18.0
  - flatted@3.4.0
  - flatted@3.4.2
  - handlebars@4.7.9
  - picomatch@2.3.2
  - picomatch@4.0.4
  - yaml@1.10.3
  - yaml@2.8.3
  - serialize-javascript@7.0.5
  - lodash@4.17.24
  - defu@6.1.5
